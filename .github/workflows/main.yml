on: push

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  lint: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: 'Install Dependencies'
        run: |
          bun install
      - name: 'Lint'
        run: |
          bun lint  
      - name: 'Knip'
        run: |
          bun knip 
      - name: 'TSC'
        run: |
          bunx tsc --build
      - name: 'Check AI Playground'
        run: |
          bun check:ai-playground

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      - name: 'Install Dependencies'
        run: |
          bun install
      - name: 'Test Pokemon'
        run: |
          bun test-pokemon
      - name: 'Test Damage'
        run: |
          bun test-damage
      - name: 'Test AI Playground'
        run: |
          bun test:ai-playground

